<div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
    {% for task in tasks %}
    <div class="task-card bg-white p-4 rounded-lg shadow-sm border">
        <div class="flex justify-between items-start mb-2">
            <h3 class="font-bold text-lg">{{ task.title }}</h3>
            <span class="px-2 py-1 rounded text-xs font-medium category-{{ task.category }}">
                {{ task.category }}
            </span>
        </div>
        <p class="text-gray-600 mb-3 line-clamp-2">{{ task.description }}</p>
        <div class="flex gap-2 mb-3">
            <span class="px-2 py-1 rounded text-xs font-medium difficulty-{{ task.difficulty }}">
                Difficulty: {{ task.difficulty }}/5
            </span>
            {% if task.is_objective %}
            <span class="px-2 py-1 rounded text-xs font-medium bg-blue-100 text-blue-800">
                Objective
            </span>
            {% endif %}
        </div>
        <a 
            href="/task/{{ task.id }}" 
            class="text-indigo-600 hover:text-indigo-800 font-medium text-sm"
        >
            View Task →
        </a>
    </div>
    {% endfor %}
    {% if not tasks %}
    <div class="col-span-full text-center py-8">
        <p class="text-gray-500">No tasks found. <a href="/submit-task" class="text-indigo-600 hover:underline">Submit one!</a></p>
    </div>
    {% endif %}
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Open Reasoning Arena (ORA)</title>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Navigation -->
        <nav class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <a href="/" class="text-xl font-bold text-indigo-600">ORA</a>
                        <span class="ml-2 text-sm text-gray-500">Open Reasoning Arena</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-gray-600 hover:text-indigo-600">Home</a>
                        <a href="/tasks" class="text-indigo-600 font-medium">Tasks</a>
                        <a href="/leaderboard" class="text-gray-600 hover:text-indigo-600">Leaderboard</a>
                        <a href="/submit-task" class="text-gray-600 hover:text-indigo-600">Submit Task</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <div class="px-4 py-6 sm:px-0">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-bold text-gray-900">Tasks</h1>
                    <a href="/submit-task" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                        Submit New Task
                    </a>
                </div>

                <!-- Filters -->
                <div class="bg-white p-4 rounded-lg shadow-sm mb-6">
                    <form hx-get="/tasks" hx-target="#tasks-list" class="flex gap-4">
                        <div>
                            <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <select id="category" name="category" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                                <option value="">All Categories</option>
                                <option value="math">Math</option>
                                <option value="logic">Logic</option>
                                <option value="code">Code</option>
                                <option value="language">Language</option>
                                <option value="science">Science</option>
                            </select>
                        </div>
                        <div>
                            <label for="difficulty" class="block text-sm font-medium text-gray-700 mb-1">Difficulty</label>
                            <select id="difficulty" name="difficulty" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                                <option value="">All Difficulties</option>
                                <option value="1">1 (Easy)</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5 (Hard)</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">
                                Filter
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Tasks List -->
                <div id="tasks-list" class="grid gap-4">
                    <!-- Tasks will be loaded here via HTMX -->
                    <script>
                        // Load tasks on page load
                        document.addEventListener('DOMContentLoaded', function() {
                            htmx.ajax('GET', '/tasks', { target: '#tasks-list', swap: 'innerHTML' });
                        });
                    </script>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t">
            <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
                <p class="text-center text-gray-500">
                    &copy; 2024 Open Reasoning Arena. All rights reserved.
                </p>
            </div>
        </footer>
    </div>
</body>
</html>

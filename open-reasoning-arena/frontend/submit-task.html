<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Task - Open Reasoning Arena (ORA)</title>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Navigation -->
        <nav class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <a href="/" class="text-xl font-bold text-indigo-600">ORA</a>
                        <span class="ml-2 text-sm text-gray-500">Open Reasoning Arena</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-gray-600 hover:text-indigo-600">Home</a>
                        <a href="/tasks" class="text-gray-600 hover:text-indigo-600">Tasks</a>
                        <a href="/leaderboard" class="text-gray-600 hover:text-indigo-600">Leaderboard</a>
                        <a href="/submit-task" class="text-indigo-600 font-medium">Submit Task</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <div class="px-4 py-6 sm:px-0">
                <div class="max-w-2xl mx-auto">
                    <h1 class="text-3xl font-bold text-gray-900 mb-6">Submit a New Task</h1>
                    
                    <form 
                        hx-post="/tasks" 
                        hx-target="#form-response" 
                        hx-swap="innerHTML"
                        class="bg-white p-6 rounded-lg shadow-sm"
                    >
                        <div class="mb-4">
                            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                            <input 
                                type="text" 
                                id="title" 
                                name="title" 
                                required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                placeholder="e.g., Linear Equation Solver"
                            >
                        </div>
                        
                        <div class="mb-4">
                            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                            <textarea 
                                id="description" 
                                name="description" 
                                rows="4" 
                                required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                placeholder="Describe the task in detail..."
                            ></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <select 
                                id="category" 
                                name="category" 
                                required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            >
                                <option value="">Select a category</option>
                                <option value="math">Math</option>
                                <option value="logic">Logic</option>
                                <option value="code">Code</option>
                                <option value="language">Language</option>
                                <option value="science">Science</option>
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label for="difficulty" class="block text-sm font-medium text-gray-700 mb-1">Difficulty (1-5)</label>
                            <input 
                                type="number" 
                                id="difficulty" 
                                name="difficulty" 
                                min="1" 
                                max="5" 
                                required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                placeholder="1-5"
                            >
                        </div>
                        
                        <div class="mb-4">
                            <label class="flex items-center">
                                <input 
                                    type="checkbox" 
                                    id="is_objective" 
                                    name="is_objective" 
                                    class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded"
                                >
                                <span class="ml-2 block text-sm text-gray-700">This task has an objective answer (can be auto-scored)</span>
                            </label>
                        </div>
                        
                        <div class="mb-4" id="expected-answer-container" style="display: none;">
                            <label for="expected_answer" class="block text-sm font-medium text-gray-700 mb-1">Expected Answer</label>
                            <textarea 
                                id="expected_answer" 
                                name="expected_answer" 
                                rows="2"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                placeholder="The correct answer for auto-scoring..."
                            ></textarea>
                        </div>
                        
                        <div class="flex justify-end">
                            <button 
                                type="submit" 
                                class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
                            >
                                Submit Task
                            </button>
                        </div>
                    </form>
                    
                    <div id="form-response" class="mt-4"></div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t">
            <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
                <p class="text-center text-gray-500">
                    &copy; 2024 Open Reasoning Arena. All rights reserved.
                </p>
            </div>
        </footer>
    </div>
    
    <script>
        // Show/hide expected answer field based on is_objective checkbox
        document.addEventListener('DOMContentLoaded', function() {
            const checkbox = document.getElementById('is_objective');
            const container = document.getElementById('expected-answer-container');
            
            checkbox.addEventListener('change', function() {
                container.style.display = this.checked ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Open Reasoning Arena (ORA)</title>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Navigation -->
        <nav class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <a href="/" class="text-xl font-bold text-indigo-600">ORA</a>
                        <span class="ml-2 text-sm text-gray-500">Open Reasoning Arena</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-gray-600 hover:text-indigo-600">Home</a>
                        <a href="/tasks" class="text-gray-600 hover:text-indigo-600">Tasks</a>
                        <a href="/leaderboard" class="text-indigo-600 font-medium">Leaderboard</a>
                        <a href="/submit-task" class="text-gray-600 hover:text-indigo-600">Submit Task</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <div class="px-4 py-6 sm:px-0">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-bold text-gray-900">Leaderboard</h1>
                    <button 
                        hx-get="/leaderboard" 
                        hx-trigger="click" 
                        hx-target="#leaderboard-table"
                        class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition"
                    >
                        Refresh
                    </button>
                </div>

                <!-- Leaderboard Table -->
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div id="leaderboard-table" class="overflow-x-auto">
                        <!-- Leaderboard will be loaded here via HTMX -->
                        <script>
                            // Load leaderboard on page load
                            document.addEventListener('DOMContentLoaded', function() {
                                htmx.ajax('GET', '/leaderboard', { target: '#leaderboard-table', swap: 'innerHTML' });
                            });
                        </script>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t">
            <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
                <p class="text-center text-gray-500">
                    &copy; 2024 Open Reasoning Arena. All rights reserved.
                </p>
            </div>
        </footer>
    </div>
</body>
</html>

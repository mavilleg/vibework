name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.7.0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ora
          POSTGRES_PASSWORD: ora
          POSTGRES_DB: ora_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "open-reasoning-arena/backend/requirements*.txt"
      
      - name: Install dependencies
        run: |
          cd open-reasoning-arena/backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run linting
        run: |
          cd open-reasoning-arena/backend
          ruff check .
          black --check .
          isort --check-only .
      
      - name: Run type checking
        run: |
          cd open-reasoning-arena/backend
          mypy . --ignore-missing-imports
      
      - name: Run tests with SQLite
        run: |
          cd open-reasoning-arena/backend
          DATABASE_URL=sqlite:///./test.db pytest tests/ -v --cov=backend --cov-report=xml
        env:
          DATABASE_URL: sqlite:///./test.db
          ENVIRONMENT: test
      
      - name: Run tests with PostgreSQL
        run: |
          cd open-reasoning-arena/backend
          DATABASE_URL=postgresql://ora:ora@localhost:5432/ora_test pytest tests/ -v --cov=backend --cov-report=xml
        env:
          DATABASE_URL: postgresql://ora:ora@localhost:5432/ora_test
          ENVIRONMENT: test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./open-reasoning-arena/backend/coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./open-reasoning-arena
          file: ./open-reasoning-arena/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/open-reasoning-arena:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/open-reasoning-arena:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # e.g., kubectl apply -f k8s/
          # or docker-compose -f docker-compose.prod.yml up -d

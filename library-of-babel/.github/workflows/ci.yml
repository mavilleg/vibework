name: Continuous Integration

on:
  push:
    branches: [main, develop, feature/*]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          flags: unittests
          name: coverage-${{ matrix.python-version }}

  lint:
    name: Linting and Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          pip install black flake8 mypy isort pylint bandit safety

      - name: Run Black
        run: |
          black --check src/ tests/ --line-length=88 --diff

      - name: Run isort
        run: |
          isort --check-only src/ tests/ --line-length=88 --profile=black

      - name: Run Flake8
        run: |
          flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203 --max-complexity=10

      - name: Run MyPy
        run: |
          mypy src/ --ignore-missing-imports --disallow-untyped-defs --line-length=88

      - name: Run Pylint
        run: |
          pylint src/ --disable=C0114,C0115,C0116 --max-line-length=88 --exit-zero

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-results.json || true

      - name: Run Safety
        run: |
          pip install safety
          safety check -r requirements.txt --json || true

      - name: Upload security results
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: bandit-results.json

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false
          tags: library-of-babel:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: Run container tests
        run: |
          docker run --rm library-of-babel:test python -m pytest tests/ -v
